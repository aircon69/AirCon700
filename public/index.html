<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Utility</title>
    <!-- 1. Include Ultraviolet's required scripts from your deployed project -->
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- 2. Keep the iframe empty at first -->
    <iframe id="proxyFrame"></iframe>

    <script>
        // 3. Wait for the proxy files to load, then point it to DuckDuckGo
        window.addEventListener('load', async () => {
            // This encodes the URL so the proxy server can read it safely
            const targetUrl = 'https://lite.duckduckgo.com';
            const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(targetUrl);
            
            // Forces the iframe to load through your unblocked proxy path
            document.getElementById('proxyFrame').src = encodedUrl;
        });
    </script>

</body>
</html>
